[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "opentrons-liquid-handler-engine"
version = "2.0.0"
description = "OT-2 Liquid Handler: Python Protocol & Pipetting Accuracy Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
opentrons-liquid-handler-engine = "opentrons_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/opentrons-liquid-handler-engine"
Repository = "https://github.com/abusuraihsakhri/opentrons-liquid-handler-engine.git"
